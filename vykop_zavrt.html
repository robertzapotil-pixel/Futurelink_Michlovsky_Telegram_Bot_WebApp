<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Připraveno pro závrt</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  select, input[type="text"], input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--hint);
    border-radius: 8px;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
  }
  .hint { color: var(--hint); font-size: 13px; margin-top: 4px; }
  .status-ok { color: #2ecc71; }
  .status-bad { color: #e74c3c; }
  .input-with-key { display: flex; gap: 8px; }
  .input-with-key input { flex: 1; min-width: 0; }
  button.slash-key {
    flex: 0 0 56px;
    border: 1px solid var(--button);
    border-radius: 8px;
    background: none;
    color: var(--button);
    font-size: 22px;
    font-weight: 700;
  }
  button#submit {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 600;
  }
  button#submit:disabled { opacity: 0.5; }
</style>
</head>
<body>
  <h1>Připraveno pro závrt</h1>

  <label for="obec">Obec</label>
  <select id="obec" required></select>

  <label for="ulice">Ulice</label>
  <input type="text" id="ulice" placeholder="Nepovinné" />

  <label for="cislo_typ">Typ čísla</label>
  <select id="cislo_typ" required>
    <option value="" disabled selected>— vyber —</option>
    <option>Číslo popisné</option>
    <option>Číslo orientační</option>
    <option>Číslo evidenční</option>
    <option>Číslo parcely</option>
    <option>Číslo bodu z PD</option>
  </select>

  <label for="cislo_hodnota">Číslo</label>
  <!-- Numeric keypad for the digit-only number types (see updateKeyboard());
       the on-screen "/" key exists because mobile numeric keypads have none. -->
  <div class="input-with-key">
    <input type="text" id="cislo_hodnota" required />
    <button type="button" class="slash-key" id="slash_key" aria-label="Vložit lomítko">/</button>
  </div>

  <label for="foto_vykop_mt">Foto výkopu a MT připraveno pro závrt</label>
  <input type="file" id="foto_vykop_mt" />

  <label for="poznamka">Poznámka</label>
  <input type="text" id="poznamka" placeholder="Nepovinné" />

  <label>GPS poloha</label>
  <div class="hint" id="gps_status">Hledám polohu…</div>

  <button id="submit">Odeslat</button>
  <div class="hint" id="submit_status"></div>

<script>
  // Apps Script Web App that saves an uploaded photo to Drive and returns its fileId.
  const UPLOAD_URL = "https://script.google.com/macros/s/AKfycby5aOfaJjORZCQ5gFtgSJ7ZFPnFc9qwacHYVxAQDOBeykc9wfMcnLrJ-dj2-loTzA3SrA/exec";
  const UPLOAD_MAX_DIM = 1280; // smaller upload = faster; still plenty for documentation photos
  const UPLOAD_JPEG_QUALITY = 0.7;
  const PHOTO_ACCEPT = "image/jpeg,image/png,image/heic,image/heif,image/webp";
  const NUMERIC_CISLO_TYPES = ["Číslo popisné", "Číslo orientační", "Číslo evidenční"];

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(location.search);
  const obceList = (params.get("obce") || "").split("|").filter(Boolean);
  const obecSelect = document.getElementById("obec");
  const obecPlaceholder = document.createElement("option");
  obecPlaceholder.value = "";
  obecPlaceholder.textContent = "— vyber —";
  obecPlaceholder.disabled = true;
  obecPlaceholder.selected = true;
  obecSelect.appendChild(obecPlaceholder);
  obceList.forEach((name) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    obecSelect.appendChild(opt);
  });

  const cisloTypSelect = document.getElementById("cislo_typ");
  const cisloInput = document.getElementById("cislo_hodnota");
  const photoInput = document.getElementById("foto_vykop_mt");
  // Explicit MIME list (not the "image/*" wildcard) and no `capture`
  // attribute — on some Telegram iOS versions "image/*" alone makes the
  // WebView jump straight to the camera instead of offering the photo
  // library too.
  photoInput.accept = PHOTO_ACCEPT;

  // Parcel numbers ("st. 12/3") and PD point numbers may contain letters, so
  // only the digit-only number types get the numeric keypad.
  function updateKeyboard() {
    cisloInput.setAttribute("inputmode", NUMERIC_CISLO_TYPES.includes(cisloTypSelect.value) ? "numeric" : "text");
  }
  cisloTypSelect.addEventListener("change", updateKeyboard);
  updateKeyboard();

  const slashKey = document.getElementById("slash_key");
  slashKey.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus (and keyboard) on the input
  slashKey.addEventListener("click", () => {
    const start = cisloInput.selectionStart ?? cisloInput.value.length;
    const end = cisloInput.selectionEnd ?? start;
    cisloInput.value = cisloInput.value.slice(0, start) + "/" + cisloInput.value.slice(end);
    cisloInput.setSelectionRange(start + 1, start + 1);
    cisloInput.focus();
  });

  // Downscale + re-encode as JPEG — smaller uploads.
  function loadScaledCanvas(file, maxDim) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Nepodařilo se přečíst soubor."));
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => reject(new Error("Nepodařilo se načíst fotku."));
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function uploadPhoto(file, obec) {
    const canvas = await loadScaledCanvas(file, UPLOAD_MAX_DIM);
    const dataUrl = canvas.toDataURL("image/jpeg", UPLOAD_JPEG_QUALITY);
    const dataBase64 = dataUrl.split(",")[1];

    const response = await fetch(UPLOAD_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight
      body: JSON.stringify({
        obec, kategorie: "vykop_zavrt", filename: file.name || "foto.jpg",
        mimeType: "image/jpeg", dataBase64,
      }),
    });
    if (!response.ok) throw new Error("Nahrávání selhalo (HTTP " + response.status + ")");
    const result = await response.json();
    if (!result.fileId) throw new Error("Nahrávání selhalo.");
    return result.fileId;
  }

  // GPS: watch continuously while filling the form, use the latest fix on submit.
  // Not required to submit — matches the other forms, which allow "GPS: neznámo".
  let lastPosition = null;
  const gpsStatus = document.getElementById("gps_status");
  const submitBtn = document.getElementById("submit");
  const submitStatus = document.getElementById("submit_status");

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      (pos) => {
        lastPosition = pos.coords;
        gpsStatus.textContent = `Poloha nalezena (přesnost ~${Math.round(pos.coords.accuracy)} m)`;
        gpsStatus.className = "hint status-ok";
      },
      () => {
        gpsStatus.textContent = "Polohu se nepodařilo zjistit (bude uloženo jako neznámá).";
        gpsStatus.className = "hint status-bad";
      },
      { enableHighAccuracy: true, maximumAge: 10000 }
    );
  } else {
    gpsStatus.textContent = "Tento prohlížeč neumí zjistit polohu.";
  }

  submitBtn.addEventListener("click", async () => {
    const obec = obecSelect.value;

    const data = {
      form: "vykop_zavrt",
      obec,
      ulice: document.getElementById("ulice").value,
      cislo_typ: cisloTypSelect.value,
      cislo_hodnota: cisloInput.value,
      poznamka: document.getElementById("poznamka").value,
      gps: lastPosition ? { lat: lastPosition.latitude, lon: lastPosition.longitude } : null,
      photos: {},
    };

    const missingFields = [];
    if (!data.obec) missingFields.push("Obec");
    if (!data.cislo_typ) missingFields.push("Typ čísla");
    if (!data.cislo_hodnota.trim()) missingFields.push("Číslo");
    if (!photoInput.files[0]) missingFields.push("Foto výkopu a MT připraveno pro závrt");

    if (missingFields.length) {
      alert("Vyplň prosím: " + missingFields.join(", "));
      return;
    }

    submitBtn.disabled = true;
    try {
      submitStatus.textContent = "Nahrávám fotku…";
      data.photos.foto_vykop_mt = await uploadPhoto(photoInput.files[0], obec);
    } catch (err) {
      submitStatus.textContent = "";
      alert("Nahrávání fotky selhalo: " + err.message + ". Zkus to prosím znovu.");
      submitBtn.disabled = false;
      return;
    }

    submitStatus.textContent = "Odesílám…";
    tg.sendData(JSON.stringify(data));
  });
</script>
</body>
</html>
