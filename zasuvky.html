<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nová zásuvka</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 24px 0 4px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  select, input[type="text"], input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--hint);
    border-radius: 8px;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .hidden { display: none !important; }
  .hint { color: var(--hint); font-size: 13px; margin-top: 4px; }
  .status-ok { color: #2ecc71; }
  .status-bad { color: #e74c3c; }
  button#submit {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 600;
  }
  button#submit:disabled { opacity: 0.5; }
</style>
</head>
<body>
  <h1>Nová zásuvka</h1>

  <label for="obec">Obec</label>
  <select id="obec" required></select>

  <label for="ulice">Ulice</label>
  <input type="text" id="ulice" required />

  <label for="cislo_typ">Typ čísla objektu</label>
  <select id="cislo_typ" required>
    <option value="" disabled selected>— vyber —</option>
    <option>Číslo popisné</option>
    <option>Číslo orientační</option>
    <option>Číslo evidenční</option>
    <option>Parcelní číslo</option>
  </select>

  <label for="cislo_hodnota">Číslo objektu</label>
  <input type="text" id="cislo_hodnota" required />

  <label for="kapacita">Typ kabelu</label>
  <select id="kapacita" required>
    <option value="" disabled selected>— vyber —</option>
    <option>2 vl.</option><option>4 vl.</option><option>6 vl.</option>
    <option>12 vl.</option><option>24 vl.</option><option>48 vl.</option>
    <option>96 vl.</option><option>144 vl.</option><option>192 vl.</option>
    <option>288 vl.</option>
  </select>

  <label for="typ_zakonceni">Typ zakončení</label>
  <select id="typ_zakonceni" required>
    <option value="" disabled selected>— vyber —</option>
    <option>Jednozásuvka</option>
    <option>Dvojzásuvka</option>
    <option>Třízásuvka</option>
    <option>Kabelová komora</option>
    <option>Bábovka</option>
    <option>Jiné</option>
  </select>

  <div id="jine_wrap" class="hidden">
    <label for="jine_text">Popiš typ zakončení</label>
    <input type="text" id="jine_text" />
  </div>

  <div id="barvy_wrap" class="hidden"></div>

  <div id="umisteni_wrap">
    <label for="umisteni">Umístění / místnost</label>
    <select id="umisteni" required>
      <option value="" disabled selected>— vyber —</option>
      <option>Chodba</option><option>Sklep</option><option>Garáž</option>
      <option>Kuchyň</option><option>Obývák</option><option>Technická místnost</option>
      <option>Půda</option><option>Koupelna</option><option>Toaleta</option>
      <option>Pokoj</option><option>Vlastní</option>
    </select>
    <div id="umisteni_vlastni_wrap" class="hidden">
      <input type="text" id="umisteni_vlastni" placeholder="Napiš umístění" />
    </div>
  </div>

  <h2>Fotodokumentace</h2>
  <div id="zasuvka_foto_wrap"></div>
  <div id="komora_foto_wrap" class="hidden"></div>

  <label>GPS poloha</label>
  <div class="hint" id="gps_status">Hledám polohu…</div>

  <label for="poznamka">Poznámka</label>
  <input type="text" id="poznamka" placeholder="Nepovinné" />

  <button id="submit">Odeslat</button>
  <div class="hint" id="submit_status"></div>

<script>
  // Apps Script Web App that saves an uploaded photo to Drive and returns its fileId.
  const UPLOAD_URL = "https://script.google.com/macros/s/AKfycby5aOfaJjORZCQ5gFtgSJ7ZFPnFc9qwacHYVxAQDOBeykc9wfMcnLrJ-dj2-loTzA3SrA/exec";
  const UPLOAD_MAX_DIM = 1280; // smaller upload = faster; still plenty for documentation photos
  const UPLOAD_JPEG_QUALITY = 0.7;

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(location.search);
  const obceList = (params.get("obce") || "").split("|").filter(Boolean);
  const obecSelect = document.getElementById("obec");
  const obecPlaceholder = document.createElement("option");
  obecPlaceholder.value = "";
  obecPlaceholder.textContent = "— vyber —";
  obecPlaceholder.disabled = true;
  obecPlaceholder.selected = true;
  obecSelect.appendChild(obecPlaceholder);
  obceList.forEach((name) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    obecSelect.appendChild(opt);
  });

  const COLORS = ["Modrá", "Oranžová", "Zelená", "Hnědá", "Šedá", "Bílá",
                  "Červená", "Černá", "Žlutá", "Fialová", "Růžová", "Tyrkysová"];
  // Jednozásuvka is intentionally excluded — always fiber 1 / Modrá, no
  // question asked. Position labels are orientation-agnostic (outlets are
  // sometimes side by side, sometimes stacked) — the technician just picks
  // whichever color is actually at that position.
  const PORT_COUNT = { "Dvojzásuvka": 2, "Třízásuvka": 3 };
  const POSITION_LABELS = {
    2: ["1. pozice (vlevo/nahoře)", "2. pozice (vpravo/dole)"],
    3: ["1. pozice (vlevo/nahoře)", "2. pozice (uprostřed)", "3. pozice (vpravo/dole)"],
  };
  const KOMORA_TYPES = new Set(["Kabelová komora", "Bábovka"]);

  const ZASUVKA_PHOTO_SLOTS = [
    { key: "foto_qr", label: "Foto zavřené zásuvky s QR kódem" },
    { key: "foto_otevrene", label: "Foto otevřené zásuvky" },
    { key: "foto_dalka", label: "Foto zásuvky z dálky" },
    { key: "foto_objekt", label: "Foto objektu zvenku" },
  ];
  const KOMORA_PHOTO_SLOTS = [
    { key: "komora_vnitrek", label: "Foto vnitřku kabelové komory / bábovky" },
    { key: "komora_zavarene", label: "Foto zavařené bábovky / zavařené malé kabelové komory" },
    { key: "komora_dalka", label: "Foto bábovky / kabelové komory z dálky" },
  ];

  const typZakonceniSelect = document.getElementById("typ_zakonceni");
  const jineWrap = document.getElementById("jine_wrap");
  const barvyWrap = document.getElementById("barvy_wrap");
  const umisteniWrap = document.getElementById("umisteni_wrap");
  const zasuvkaFotoWrap = document.getElementById("zasuvka_foto_wrap");
  const komoraFotoWrap = document.getElementById("komora_foto_wrap");

  function renderBarvySelects(count) {
    barvyWrap.innerHTML = "";
    const labels = POSITION_LABELS[count];
    for (let i = 0; i < count; i++) {
      const label = document.createElement("label");
      label.textContent = `Barva vlákna — ${labels[i]}`;
      const select = document.createElement("select");
      select.className = "barva-select";
      COLORS.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
      barvyWrap.appendChild(label);
      barvyWrap.appendChild(select);
    }
  }

  function renderPhotoSlots(container, slots) {
    container.innerHTML = "";
    slots.forEach((slot) => {
      const label = document.createElement("label");
      label.textContent = slot.label;
      const input = document.createElement("input");
      input.type = "file";
      // Explicit MIME list (not the "image/*" wildcard) and no `capture`
      // attribute — on some Telegram iOS versions "image/*" alone makes the
      // WebView jump straight to the camera instead of offering the photo
      // library too.
      input.accept = "image/jpeg,image/png,image/heic,image/heif,image/webp";
      input.dataset.slotKey = slot.key;
      input.className = "photo-input";
      container.appendChild(label);
      container.appendChild(input);

      if (slot.key === "foto_qr") {
        const status = document.createElement("div");
        status.className = "hint";
        status.id = "qr_status";
        status.textContent = "QR kód zatím nenačten.";
        const qrLabel = document.createElement("label");
        qrLabel.textContent = "QR kód (uprav, pokud se nenačetl správně)";
        const qrManual = document.createElement("input");
        qrManual.type = "text";
        qrManual.id = "qr_manual";
        container.appendChild(status);
        container.appendChild(qrLabel);
        container.appendChild(qrManual);
        input.addEventListener("change", () => decodeQr(input.files[0]));
      }
    });
  }
  renderPhotoSlots(zasuvkaFotoWrap, ZASUVKA_PHOTO_SLOTS);
  renderPhotoSlots(komoraFotoWrap, KOMORA_PHOTO_SLOTS);

  function updateFormForTyp() {
    const typ = typZakonceniSelect.value;
    jineWrap.classList.toggle("hidden", typ !== "Jiné");
    barvyWrap.classList.toggle("hidden", !(typ in PORT_COUNT));
    if (typ in PORT_COUNT) renderBarvySelects(PORT_COUNT[typ]);

    const isKomora = KOMORA_TYPES.has(typ);
    umisteniWrap.classList.toggle("hidden", isKomora);
    zasuvkaFotoWrap.classList.toggle("hidden", isKomora);
    komoraFotoWrap.classList.toggle("hidden", !isKomora);
  }
  typZakonceniSelect.addEventListener("change", updateFormForTyp);
  updateFormForTyp();

  document.getElementById("umisteni").addEventListener("change", (e) => {
    document.getElementById("umisteni_vlastni_wrap").classList.toggle("hidden", e.target.value !== "Vlastní");
  });

  // Downscale + re-encode as JPEG — smaller uploads, and canvas pixel data for QR decode.
  function loadScaledCanvas(file, maxDim) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Nepodařilo se přečíst soubor."));
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => reject(new Error("Nepodařilo se načíst fotku."));
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Cache the (already-scaled) canvas used for QR decoding, keyed by File, so
  // uploadPhoto() can reuse it instead of re-decoding the same image again.
  const scaledCanvasCache = new WeakMap();

  // The QR sticker encodes an activation URL like
  // https://internetvzasuvce.cz/?id=B2AGWVN — only the "id" value matters
  // to us. Falls back to the raw decoded text for any other QR format.
  function extractQrCode(rawText) {
    try {
      const url = new URL(rawText);
      const id = url.searchParams.get("id");
      if (id) return id;
    } catch (err) {
      // Not a URL — use the raw text as-is.
    }
    return rawText;
  }

  // QR decode fully client-side; the image is uploaded separately (for documentation) below.
  async function decodeQr(file) {
    const status = document.getElementById("qr_status");
    if (!file) return;
    status.textContent = "Čtu QR kód…";
    status.className = "hint";

    if (typeof jsQR !== "function") {
      status.textContent = "Knihovna pro čtení QR se nenačetla. Napiš kód ručně.";
      status.className = "hint status-bad";
      return;
    }

    try {
      // The upload-sized (smaller) canvas is tried first and cached for reuse
      // on upload; only escalate to a bigger one if decoding actually needs it.
      let result = null;
      for (const maxDim of [UPLOAD_MAX_DIM, 3000]) {
        const canvas = await loadScaledCanvas(file, maxDim);
        if (maxDim === UPLOAD_MAX_DIM) scaledCanvasCache.set(file, canvas);
        const ctx = canvas.getContext("2d");
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        result = jsQR(imageData.data, canvas.width, canvas.height, { inversionAttempts: "attemptBoth" });
        if (result) break;
      }
      if (result) {
        document.getElementById("qr_manual").value = extractQrCode(result.data);
        status.textContent = "QR kód přečten.";
        status.className = "hint status-ok";
      } else {
        status.textContent = "Nepodařilo se přečíst, uprav prosím ručně výše.";
        status.className = "hint status-bad";
      }
    } catch (err) {
      status.textContent = "Nastala chyba při čtení QR kódu (" + err.message + ").";
      status.className = "hint status-bad";
    }
  }

  async function uploadPhoto(file, obec) {
    const canvas = scaledCanvasCache.get(file) || (await loadScaledCanvas(file, UPLOAD_MAX_DIM));
    const dataUrl = canvas.toDataURL("image/jpeg", UPLOAD_JPEG_QUALITY);
    const dataBase64 = dataUrl.split(",")[1];

    const response = await fetch(UPLOAD_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight
      body: JSON.stringify({
        obec, kategorie: "zasuvky", filename: file.name || "foto.jpg",
        mimeType: "image/jpeg", dataBase64,
      }),
    });
    if (!response.ok) throw new Error("Nahrávání selhalo (HTTP " + response.status + ")");
    const result = await response.json();
    if (!result.fileId) throw new Error("Nahrávání selhalo.");
    return result.fileId;
  }

  // GPS: watch continuously while filling the form, use the latest fix on submit.
  // Not required to submit — matches the reference flow, which allows "GPS: neznámo".
  let lastPosition = null;
  const gpsStatus = document.getElementById("gps_status");
  const submitBtn = document.getElementById("submit");
  const submitStatus = document.getElementById("submit_status");

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      (pos) => {
        lastPosition = pos.coords;
        gpsStatus.textContent = `Poloha nalezena (přesnost ~${Math.round(pos.coords.accuracy)} m)`;
        gpsStatus.className = "hint status-ok";
      },
      () => {
        gpsStatus.textContent = "Polohu se nepodařilo zjistit (bude uloženo jako neznámá).";
        gpsStatus.className = "hint status-bad";
      },
      { enableHighAccuracy: true, maximumAge: 10000 }
    );
  } else {
    gpsStatus.textContent = "Tento prohlížeč neumí zjistit polohu.";
  }

  submitBtn.addEventListener("click", async () => {
    const typ = typZakonceniSelect.value;
    const isKomora = KOMORA_TYPES.has(typ);
    const barvy = Array.from(document.querySelectorAll(".barva-select")).map((s) => s.value);
    const umisteni = document.getElementById("umisteni").value;
    const umisteniVlastni = document.getElementById("umisteni_vlastni").value;
    const obec = obecSelect.value;

    const data = {
      form: "zasuvky",
      obec,
      ulice: document.getElementById("ulice").value,
      cislo_typ: document.getElementById("cislo_typ").value,
      cislo_hodnota: document.getElementById("cislo_hodnota").value,
      kapacita: document.getElementById("kapacita").value,
      typ_zakonceni: typ,
      typ_zakonceni_popis: typ === "Jiné" ? document.getElementById("jine_text").value : "",
      barvy: typ in PORT_COUNT ? barvy : (typ === "Jednozásuvka" ? ["Modrá"] : []),
      umisteni: isKomora ? "" : (umisteni === "Vlastní" ? umisteniVlastni : umisteni),
      qr_kod: isKomora ? "" : document.getElementById("qr_manual").value,
      gps: lastPosition ? { lat: lastPosition.latitude, lon: lastPosition.longitude } : null,
      poznamka: document.getElementById("poznamka").value,
      photos: {},
    };

    const missingFields = [];
    if (!data.obec) missingFields.push("Obec");
    if (!data.ulice) missingFields.push("Ulice");
    if (!data.cislo_typ) missingFields.push("Typ čísla objektu");
    if (!data.cislo_hodnota) missingFields.push("Číslo objektu");
    if (!data.kapacita) missingFields.push("Typ kabelu");
    if (!data.typ_zakonceni) missingFields.push("Typ zakončení");
    if (!isKomora && !data.umisteni) missingFields.push("Umístění / místnost");

    if (missingFields.length) {
      alert("Vyplň prosím: " + missingFields.join(", "));
      return;
    }

    const activeWrap = isKomora ? komoraFotoWrap : zasuvkaFotoWrap;
    const photoInputs = Array.from(activeWrap.querySelectorAll(".photo-input"));
    const missing = photoInputs.filter((input) => !input.files[0]);
    if (missing.length) {
      alert("Vyfoť prosím všechny požadované fotky.");
      return;
    }

    submitBtn.disabled = true;
    try {
      let uploaded = 0;
      submitStatus.textContent = `Nahrávám fotky… (0/${photoInputs.length})`;
      // Uploaded in parallel — much faster than one at a time, and the Apps
      // Script side is safe against the resulting concurrent requests.
      await Promise.all(
        photoInputs.map(async (input) => {
          const fileId = await uploadPhoto(input.files[0], obec);
          data.photos[input.dataset.slotKey] = fileId;
          uploaded += 1;
          submitStatus.textContent = `Nahrávám fotky… (${uploaded}/${photoInputs.length})`;
        })
      );
    } catch (err) {
      submitStatus.textContent = "";
      alert("Nahrávání fotek selhalo: " + err.message + ". Zkus to prosím znovu.");
      submitBtn.disabled = false;
      return;
    }

    submitStatus.textContent = "Odesílám…";
    tg.sendData(JSON.stringify(data));
  });
</script>
</body>
</html>
