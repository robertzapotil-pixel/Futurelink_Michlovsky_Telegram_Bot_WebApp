<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plastová infrastruktura</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  select, input[type="text"], input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--hint);
    border-radius: 8px;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
  }
  .hint { color: var(--hint); font-size: 13px; margin-top: 4px; }
  .status-ok { color: #2ecc71; }
  .status-bad { color: #e74c3c; }
  .extra-photo-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .extra-photo-row input[type="file"] { flex: 1; }
  button.remove-extra {
    flex: 0 0 auto;
    padding: 10px 12px;
    border: 1px solid var(--hint);
    border-radius: 8px;
    background: var(--secondary-bg);
    color: var(--text);
  }
  button.add-extra {
    margin-top: 12px;
    padding: 10px 14px;
    border: 1px dashed var(--hint);
    border-radius: 8px;
    background: none;
    color: var(--link);
    font-size: 14px;
  }
  .input-with-key { display: flex; gap: 8px; }
  .input-with-key input { flex: 1; min-width: 0; }
  button.slash-key {
    flex: 0 0 56px;
    border: 1px solid var(--button);
    border-radius: 8px;
    background: none;
    color: var(--button);
    font-size: 22px;
    font-weight: 700;
  }
  button.gps-btn {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: 1px solid var(--button);
    border-radius: 8px;
    background: none;
    color: var(--button);
    font-size: 15px;
    font-weight: 600;
  }
  button.gps-btn:disabled { opacity: 0.5; }
  button#submit {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 600;
  }
  button#submit:disabled { opacity: 0.5; }
</style>
</head>
<body>
  <h1>Plastová infrastruktura</h1>

  <label for="obec">Obec</label>
  <select id="obec" required></select>

  <label for="typ">Typ</label>
  <select id="typ" required>
    <option value="" disabled selected>— vyber —</option>
    <option>Výpich</option>
    <option>T-matrix</option>
    <option>Propojení MD</option>
    <option>Ukončení MD</option>
    <option>Propojení HDPE</option>
    <option>Ukončení HDPE</option>
    <option>Postavení rozvaděčů</option>
  </select>

  <div id="steps_wrap"></div>

  <button id="submit">Odeslat</button>
  <div class="hint" id="submit_status"></div>

<script>
  // Apps Script Web App that saves an uploaded photo to Drive and returns its fileId.
  const UPLOAD_URL = "https://script.google.com/macros/s/AKfycby5aOfaJjORZCQ5gFtgSJ7ZFPnFc9qwacHYVxAQDOBeykc9wfMcnLrJ-dj2-loTzA3SrA/exec";
  const UPLOAD_MAX_DIM = 1280; // smaller upload = faster; still plenty for documentation photos
  const UPLOAD_JPEG_QUALITY = 0.7;
  const PHOTO_ACCEPT = "image/jpeg,image/png,image/heic,image/heif,image/webp";
  const MAX_TOTAL_PHOTOS = 10; // Telegram media group limit
  const TYPES_WITH_HOUSE = new Set(["Výpich", "T-matrix"]);

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(location.search);
  const technik = params.get("technik") || "";
  const authTs = params.get("auth_ts") || "";
  const authSig = params.get("auth_sig") || "";
  const obceList = (params.get("obce") || "").split("|").filter(Boolean);
  const obecSelect = document.getElementById("obec");
  const obecPlaceholder = document.createElement("option");
  obecPlaceholder.value = "";
  obecPlaceholder.textContent = "— vyber —";
  obecPlaceholder.disabled = true;
  obecPlaceholder.selected = true;
  obecSelect.appendChild(obecPlaceholder);
  obceList.forEach((name) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    obecSelect.appendChild(opt);
  });

  // Ordered steps per type; the form renders exactly this sequence. Photo
  // `key`s must stay in sync with PHOTO_SLOTS_BY_TYPE in
  // forms/plastova_infrastruktura.py (tests/test_plastova_infrastruktura.py
  // checks it). Steps: text / select (input fields, sent under their `key`;
  // `required` blocks submit), photo (required), gps (button that saves the
  // position on the spot), extra (optional "Foto jiné"), house (pick a dům
  // from Evidence, scoped to the already-selected Obec above), checkbox.
  // The four types using PLACEHOLDER_STEPS are still waiting for their real shot list.
  const NOTE_STEP = { kind: "text", key: "poznamka", label: "Poznámka", placeholder: "Nepovinné" };
  const PRACE_DOKONCENA_STEP = { kind: "checkbox", key: "prace_dokoncena", label: "Práce dokončena" };

  // Výpich/T-matrix identify the object by picking a dům from Evidence
  // (replaces manual Ulice/Typ čísla/Číslo entry) instead of a plain Obec
  // dropdown — scoped to whichever Obec is already selected above, so the
  // technician doesn't pick the village twice.
  const HOUSE_STEP = { kind: "house" };

  const PLACEHOLDER_STEPS = [
    { kind: "photo", key: "foto_1", label: "Foto" },
    { kind: "gps", label: "Lokalizovat GPS souřadnici" },
    { kind: "extra" },
    NOTE_STEP,
  ];

  const FORM_STEPS_BY_TYPE = {
    "Výpich": [
      HOUSE_STEP,
      { kind: "photo", key: "foto_zblizka", label: "Foto výpichu MD z blízka" },
      { kind: "gps", label: "Vybrat GPS souřadnice" },
      { kind: "photo", key: "foto_z_dalky", label: "Foto z dálky výkopu výpich MD" },
      { kind: "photo", key: "foto_dum", label: "Foto domu čp." },
      { kind: "extra" },
      NOTE_STEP,
      PRACE_DOKONCENA_STEP,
    ],
    "T-matrix": [
      HOUSE_STEP,
      { kind: "photo", key: "foto_otevreny", label: "Foto otevřeného T-matrixu vč. spojek" },
      { kind: "gps", label: "Vybrat GPS souřadnice" },
      { kind: "photo", key: "foto_zavreny", label: "Foto zavřeného T-matrixu" },
      { kind: "photo", key: "foto_z_dalky", label: "Foto z dálky výkopu T-matrix" },
      { kind: "photo", key: "foto_dum", label: "Foto domu čp." },
      { kind: "extra" },
      NOTE_STEP,
      PRACE_DOKONCENA_STEP,
    ],
    "Propojení MD": PLACEHOLDER_STEPS,
    "Ukončení MD": PLACEHOLDER_STEPS,
    "Propojení HDPE": PLACEHOLDER_STEPS,
    "Ukončení HDPE": PLACEHOLDER_STEPS,
    "Postavení rozvaděčů": [
      { kind: "text", key: "nazev_rozvadece", label: "Název rozvaděče", required: true },
      { kind: "photo", key: "foto_rozvadec", label: "Foto postaveného rozvaděče" },
      { kind: "gps", label: "Vybrat GPS souřadnice" },
      NOTE_STEP,
    ],
  };

  const typSelect = document.getElementById("typ");
  const stepsWrap = document.getElementById("steps_wrap");
  const submitBtn = document.getElementById("submit");
  const submitStatus = document.getElementById("submit_status");

  // GPS: a fix saved with the button (lockedPosition) wins over the background
  // one (lastPosition, kept warm by watchPosition) so the coordinates stay at
  // the spot even if the technician walks away for the far-away photo.
  // Never blocks submit — no fix means "GPS: neznámo", like the other forms.
  let lockedPosition = null;
  let lastPosition = null;
  let gpsFailed = false;
  let gpsStatusEl = null;
  let extraPhotosWrap = null;
  let selectedDumHouse = null;
  // Single slot for the house step's "obec changed" handler — renderSteps()
  // clears it on every type switch, renderHouseStep() fills it in, and one
  // obecSelect listener (registered once, below) calls whatever's in it.
  // Avoids stacking a fresh listener on obecSelect every time the technician
  // flips between Výpich/T-matrix and another type.
  let onObecChangeForHouseStep = null;
  obecSelect.addEventListener("change", () => onObecChangeForHouseStep?.());

  // Evidence house list — Apps Script Web App (appscript/evidence_api.gs),
  // same auth scheme as webapp/house-picker.js (bot-signed auth_ts/auth_sig,
  // not Telegram.WebApp.initData — see CLAUDE.md 2026-10-07). Fetched once;
  // the "Dům" step filters it client-side by the already-selected Obec.
  const HOUSES_API_URL = "https://script.google.com/macros/s/AKfycbwY-xfq1o3jIv1nwRME9VumUDgZN4A3L9CYbUmWwFCqwoDoccDo_tucqCs2B0jsUJbJAQ/exec";
  const housesPromise = fetch(HOUSES_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ auth_ts: authTs, auth_sig: authSig, technik }),
  })
    .then((r) => r.json())
    .then((data) => (data.error ? [] : data.houses || []))
    .catch(() => []);

  function renderGpsStatus() {
    if (!gpsStatusEl) return;
    if (lockedPosition) {
      gpsStatusEl.textContent = `Poloha uložena (přesnost ~${Math.round(lockedPosition.accuracy)} m).`;
      gpsStatusEl.className = "hint status-ok";
    } else if (lastPosition) {
      gpsStatusEl.textContent =
        "Klepni na tlačítko přímo na místě. Jinak se při odeslání použije aktuální poloha " +
        `(přesnost ~${Math.round(lastPosition.accuracy)} m).`;
      gpsStatusEl.className = "hint";
    } else if (gpsFailed) {
      gpsStatusEl.textContent = "Polohu se nepodařilo zjistit (bude uloženo jako neznámá).";
      gpsStatusEl.className = "hint status-bad";
    } else {
      gpsStatusEl.textContent = "Hledám polohu…";
      gpsStatusEl.className = "hint";
    }
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      (pos) => { lastPosition = pos.coords; gpsFailed = false; renderGpsStatus(); },
      () => { gpsFailed = true; renderGpsStatus(); },
      { enableHighAccuracy: true, maximumAge: 10000 }
    );
  } else {
    gpsFailed = true;
  }

  function lockPosition(btn) {
    if (!navigator.geolocation) {
      alert("Tento prohlížeč neumí zjistit polohu.");
      return;
    }
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Zjišťuji polohu…";
    const finish = () => {
      btn.disabled = false;
      btn.textContent = originalText;
      renderGpsStatus();
    };
    navigator.geolocation.getCurrentPosition(
      (pos) => { lockedPosition = pos.coords; finish(); },
      () => { alert("Polohu se nepodařilo zjistit. Zkus to prosím znovu."); finish(); },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  }

  function makeLabel(text) {
    const label = document.createElement("label");
    label.textContent = text;
    return label;
  }

  function makeFileInput(className) {
    const input = document.createElement("input");
    input.type = "file";
    // Explicit MIME list (not the "image/*" wildcard) and no `capture`
    // attribute — on some Telegram iOS versions "image/*" alone makes the
    // WebView jump straight to the camera instead of offering the photo
    // library too.
    input.accept = PHOTO_ACCEPT;
    input.className = className;
    return input;
  }

  function renderPhotoStep(step) {
    const input = makeFileInput("photo-input");
    input.dataset.slotKey = step.key;
    input.dataset.label = step.label;
    stepsWrap.appendChild(makeLabel(step.label));
    stepsWrap.appendChild(input);
  }

  function renderGpsStep(step) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "gps-btn";
    btn.textContent = step.label;
    btn.addEventListener("click", () => lockPosition(btn));
    gpsStatusEl = document.createElement("div");
    stepsWrap.appendChild(btn);
    stepsWrap.appendChild(gpsStatusEl);
    renderGpsStatus();
  }

  // "Foto jiné" — unlimited (up to the album cap) optional extra photos, each
  // its own file input added on demand, numbered on submit.
  function renderExtraStep() {
    const wrap = document.createElement("div");
    extraPhotosWrap = wrap;

    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "add-extra";
    addBtn.textContent = "+ Přidat fotku";
    addBtn.addEventListener("click", () => {
      const requiredCount = stepsWrap.querySelectorAll(".photo-input").length;
      if (requiredCount + wrap.children.length >= MAX_TOTAL_PHOTOS) {
        alert(`Na jedno odeslání je maximum ${MAX_TOTAL_PHOTOS} fotek.`);
        return;
      }
      const row = document.createElement("div");
      row.className = "extra-photo-row";
      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "remove-extra";
      removeBtn.textContent = "✕";
      removeBtn.addEventListener("click", () => row.remove());
      row.appendChild(makeFileInput("extra-photo-input"));
      row.appendChild(removeBtn);
      wrap.appendChild(row);
    });

    stepsWrap.appendChild(makeLabel("Foto jiné (nepovinné)"));
    stepsWrap.appendChild(wrap);
    stepsWrap.appendChild(addBtn);
  }

  function houseLabel(house) {
    const cislo = house.cislo_popisne || house.cislo_orientacni
      ? house.cislo_popisne || house.cislo_orientacni
      : house.parcelni_cislo ? `parc. ${house.parcelni_cislo}` : "bez čísla";
    const star = house.planovano_dnes ? "⭐ " : "";
    return `${star}${cislo} · ${house.ulice || "—"} · ${house.jmeno} (#${house.id})`;
  }

  function renderHouseStep() {
    const dumSelect = document.createElement("select");
    dumSelect.id = "dum_select";
    dumSelect.disabled = true;
    dumSelect.innerHTML = '<option value="">— nejdřív vyber obec —</option>';

    const card = document.createElement("div");
    card.className = "hint";
    card.style.display = "none";
    card.style.marginTop = "8px";

    const confirmLabel = document.createElement("label");
    confirmLabel.style.display = "none";
    confirmLabel.style.fontWeight = "400";
    confirmLabel.style.marginTop = "8px";
    const confirmCheckbox = document.createElement("input");
    confirmCheckbox.type = "checkbox";
    confirmCheckbox.id = "dum_confirm";
    confirmCheckbox.style.width = "auto";
    confirmCheckbox.style.display = "inline-block";
    confirmCheckbox.style.verticalAlign = "middle";
    const confirmText = document.createElement("span");
    confirmLabel.appendChild(confirmCheckbox);
    confirmLabel.appendChild(confirmText);

    stepsWrap.appendChild(makeLabel("Dům"));
    stepsWrap.appendChild(dumSelect);
    stepsWrap.appendChild(card);
    stepsWrap.appendChild(confirmLabel);

    function populateDomy(houses, obec) {
      const inObec = houses
        .filter((h) => h.obec === obec && h.id)
        .sort((a, b) => (b.planovano_dnes ? 1 : 0) - (a.planovano_dnes ? 1 : 0));
      dumSelect.innerHTML = '<option value="">— vyber —</option>';
      inObec.forEach((house) => {
        const opt = document.createElement("option");
        opt.value = house.id;
        opt.textContent = houseLabel(house);
        dumSelect.appendChild(opt);
      });
      dumSelect.disabled = inObec.length === 0;
      if (inObec.length === 0) dumSelect.innerHTML = '<option value="">V této obci nejsou žádné domy s ID</option>';
      return inObec;
    }

    let housesInObec = [];
    housesPromise.then((houses) => {
      if (obecSelect.value) housesInObec = populateDomy(houses, obecSelect.value);
      onObecChangeForHouseStep = () => {
        selectedDumHouse = null;
        confirmCheckbox.checked = false;
        card.style.display = "none";
        confirmLabel.style.display = "none";
        housesInObec = obecSelect.value ? populateDomy(houses, obecSelect.value) : [];
      };
    });

    dumSelect.addEventListener("change", () => {
      selectedDumHouse = housesInObec.find((h) => String(h.id) === dumSelect.value) || null;
      confirmCheckbox.checked = false;
      if (!selectedDumHouse) {
        card.style.display = "none";
        confirmLabel.style.display = "none";
        return;
      }
      const cisloLine = selectedDumHouse.cislo_popisne
        ? `č.p. ${selectedDumHouse.cislo_popisne}`
        : selectedDumHouse.cislo_orientacni
        ? `č.o. ${selectedDumHouse.cislo_orientacni}`
        : selectedDumHouse.parcelni_cislo
        ? `parc. ${selectedDumHouse.parcelni_cislo}`
        : "bez čísla";
      card.innerHTML = [
        `<strong>#${selectedDumHouse.id} ${selectedDumHouse.jmeno}</strong>`,
        `${selectedDumHouse.ulice || "—"}, ${cisloLine}, ${selectedDumHouse.obec}`,
        selectedDumHouse.telefon || "",
      ].filter(Boolean).join("<br>");
      card.style.display = "block";
      confirmText.textContent =
        `Zapisuješ k domu #${selectedDumHouse.id} – ${selectedDumHouse.jmeno}, ` +
        `${selectedDumHouse.ulice || "—"} ${cisloLine}, ${selectedDumHouse.obec}. Souhlasí?`;
      confirmLabel.style.display = "block";
    });
  }

  function renderCheckboxStep(step) {
    const label = document.createElement("label");
    label.style.fontWeight = "400";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.id = `checkbox_${step.key}`;
    input.style.width = "auto";
    input.style.display = "inline-block";
    input.style.verticalAlign = "middle";
    label.appendChild(input);
    label.appendChild(document.createTextNode(" " + step.label));
    stepsWrap.appendChild(label);
  }

  function renderFieldStep(step) {
    let input;
    if (step.kind === "select") {
      input = document.createElement("select");
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "— vyber —";
      placeholder.disabled = true;
      placeholder.selected = true;
      input.appendChild(placeholder);
      step.options.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement("input");
      input.type = "text";
      if (step.placeholder) input.placeholder = step.placeholder;
    }
    input.className = "field-input";
    input.dataset.fieldKey = step.key;
    input.dataset.label = step.label;
    if (step.required) input.dataset.required = "1";
    if (step.numericWhen) input.dataset.numericWhen = JSON.stringify(step.numericWhen);
    stepsWrap.appendChild(makeLabel(step.label));
    if (step.slashKey) {
      const row = document.createElement("div");
      row.className = "input-with-key";
      const slashBtn = document.createElement("button");
      slashBtn.type = "button";
      slashBtn.className = "slash-key";
      slashBtn.textContent = "/";
      slashBtn.setAttribute("aria-label", "Vložit lomítko");
      slashBtn.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus (and keyboard) on the input
      slashBtn.addEventListener("click", () => {
        const start = input.selectionStart ?? input.value.length;
        const end = input.selectionEnd ?? start;
        input.value = input.value.slice(0, start) + "/" + input.value.slice(end);
        input.setSelectionRange(start + 1, start + 1);
        input.focus();
      });
      row.appendChild(input);
      row.appendChild(slashBtn);
      stepsWrap.appendChild(row);
    } else {
      stepsWrap.appendChild(input);
    }
  }

  // Switches a text field's mobile keyboard to numeric while another field
  // (e.g. the number type) has one of the given values.
  function wireNumericKeyboards() {
    stepsWrap.querySelectorAll("[data-numeric-when]").forEach((input) => {
      const { key, values } = JSON.parse(input.dataset.numericWhen);
      const source = stepsWrap.querySelector(`[data-field-key="${key}"]`);
      if (!source) return;
      const update = () => input.setAttribute("inputmode", values.includes(source.value) ? "numeric" : "text");
      source.addEventListener("change", update);
      update();
    });
  }

  function renderSteps() {
    stepsWrap.innerHTML = "";
    gpsStatusEl = null;
    extraPhotosWrap = null;
    selectedDumHouse = null;
    onObecChangeForHouseStep = null;
    (FORM_STEPS_BY_TYPE[typSelect.value] || []).forEach((step) => {
      if (step.kind === "photo") renderPhotoStep(step);
      else if (step.kind === "gps") renderGpsStep(step);
      else if (step.kind === "extra") renderExtraStep();
      else if (step.kind === "house") renderHouseStep();
      else if (step.kind === "checkbox") renderCheckboxStep(step);
      else renderFieldStep(step);
    });
    wireNumericKeyboards();
  }
  typSelect.addEventListener("change", renderSteps);

  // Downscale + re-encode as JPEG — smaller uploads.
  function loadScaledCanvas(file, maxDim) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Nepodařilo se přečíst soubor."));
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => reject(new Error("Nepodařilo se načíst fotku."));
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function uploadPhoto(file, obec, domId) {
    const canvas = await loadScaledCanvas(file, UPLOAD_MAX_DIM);
    const dataUrl = canvas.toDataURL("image/jpeg", UPLOAD_JPEG_QUALITY);
    const dataBase64 = dataUrl.split(",")[1];
    const filename = domId ? `${domId}_${file.name || "foto.jpg"}` : (file.name || "foto.jpg");

    const response = await fetch(UPLOAD_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight
      body: JSON.stringify({
        obec, kategorie: "plastova_infrastruktura", filename,
        mimeType: "image/jpeg", dataBase64,
      }),
    });
    if (!response.ok) throw new Error("Nahrávání selhalo (HTTP " + response.status + ")");
    const result = await response.json();
    if (!result.fileId) throw new Error("Nahrávání selhalo.");
    return result.fileId;
  }

  submitBtn.addEventListener("click", async () => {
    const typ = typSelect.value;
    const usesHouse = TYPES_WITH_HOUSE.has(typ);
    const pos = lockedPosition || lastPosition;
    const dumConfirmed = usesHouse && selectedDumHouse && document.getElementById("dum_confirm")?.checked;

    const data = {
      form: "plastova_infrastruktura",
      typ,
      gps: pos ? { lat: pos.latitude, lon: pos.longitude } : null,
      photos: {},
    };
    if (usesHouse) {
      data.dum_id = dumConfirmed ? selectedDumHouse.id : null;
      data.prace_dokoncena = document.getElementById("checkbox_prace_dokoncena")?.checked || false;
    } else {
      data.obec = obecSelect.value;
    }

    const missingFields = [];
    if (usesHouse) {
      if (!data.dum_id) missingFields.push("Dům (vyber obec, dům a potvrď)");
    } else if (!data.obec) {
      missingFields.push("Obec");
    }
    if (!data.typ) missingFields.push("Typ");
    stepsWrap.querySelectorAll(".field-input").forEach((input) => {
      const value = input.value.trim();
      data[input.dataset.fieldKey] = value;
      if (input.dataset.required && !value) missingFields.push(input.dataset.label);
    });
    if (missingFields.length) {
      alert("Vyplň prosím: " + missingFields.join(", "));
      return;
    }

    const requiredInputs = Array.from(stepsWrap.querySelectorAll(".photo-input"));
    const missingPhotos = requiredInputs.filter((input) => !input.files[0]);
    if (missingPhotos.length) {
      alert("Chybí fotka: " + missingPhotos.map((input) => input.dataset.label).join("; "));
      return;
    }

    const extraInputs = extraPhotosWrap
      ? Array.from(extraPhotosWrap.querySelectorAll(".extra-photo-input")).filter((input) => input.files[0])
      : [];

    const uploadObec = usesHouse ? selectedDumHouse.obec : data.obec;
    const uploadDomId = usesHouse ? selectedDumHouse.id : null;

    submitBtn.disabled = true;
    try {
      let uploaded = 0;
      const total = requiredInputs.length + extraInputs.length;
      submitStatus.textContent = `Nahrávám fotky… (0/${total})`;
      const upload = async (input, key) => {
        const fileId = await uploadPhoto(input.files[0], uploadObec, uploadDomId);
        uploaded += 1;
        submitStatus.textContent = `Nahrávám fotky… (${uploaded}/${total})`;
        return [key, fileId];
      };
      // Uploaded in parallel — much faster than one at a time, and the Apps
      // Script side is safe against the resulting concurrent requests.
      // Promise.all keeps the array order, so the photos end up in the album
      // in form order (required ones first, then extras) regardless of which
      // upload finishes first.
      const entries = await Promise.all([
        ...requiredInputs.map((input) => upload(input, input.dataset.slotKey)),
        ...extraInputs.map((input, i) => upload(input, `foto_jine_${i + 1}`)),
      ]);
      entries.forEach(([key, fileId]) => { data.photos[key] = fileId; });
    } catch (err) {
      submitStatus.textContent = "";
      alert("Nahrávání fotek selhalo: " + err.message + ". Zkus to prosím znovu.");
      submitBtn.disabled = false;
      return;
    }

    submitStatus.textContent = "Odesílám…";
    tg.sendData(JSON.stringify(data));
  });
</script>
</body>
</html>
